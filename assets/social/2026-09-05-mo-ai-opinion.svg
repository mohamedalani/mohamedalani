<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#0b0b0b"/><rect x="0" y="0" width="1200" height="22" fill="#ff7a00"/><rect x="80" y="90" width="420" height="420" rx="34" fill="#ff7a00"/><image href="data:image/jpeg;base64,/9j/4QAA" x="92" y="102" width="396" height="396" preserveAspectRatio="xMidYMid slice"/><text x="550" y="178" fill="#ff7a00" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="2">10 CORRECTIONS</text><text x="550" y="235" fill="#ff7a00" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="2">PLUS TARD</text><text x="550" y="325" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700">Mon IA écrivait</text><text x="550" y="385" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700">toujours trop sage.</text><rect x="80" y="600" width="1040" height="340" rx="42" fill="#ffffff"/><polygon points="505,600 590,530 645,600" fill="#ffffff"/><text x="600" y="740" text-anchor="middle" fill="#111111" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="700"><tspan x="600">« je veux que tu</tspan><tspan x="600" dy="95">te mouilles »</tspan></text><text x="600" y="1050" text-anchor="middle" fill="#d6d6d6" font-family="Arial,Helvetica,sans-serif" font-size="34">Une vraie consigne de Mo à son IA.</text><rect x="420" y="1110" width="360" height="10" rx="5" fill="#ff7a00"/></svg>