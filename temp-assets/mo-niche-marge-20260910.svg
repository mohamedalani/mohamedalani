<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#071525"/>
  <circle cx="1080" cy="120" r="250" fill="#14304d"/>
  <circle cx="80" cy="1110" r="280" fill="#0f2944"/>
  <text x="90" y="145" fill="#8ed7ff" font-family="Arial, sans-serif" font-size="38" font-weight="700">CHOISIR UNE NICHE</text>
  <text x="90" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-size="82" font-weight="800">Le gros chiffre</text>
  <text x="90" y="365" fill="#ffffff" font-family="Arial, sans-serif" font-size="82" font-weight="800">d’affaires te distrait.</text>
  <rect x="90" y="445" width="1020" height="250" rx="34" fill="#10243a" stroke="#ff6b6b" stroke-width="6"/>
  <text x="145" y y="540" fill="#ff8a8a" font-family="Arial, sans-serif" font-size="46" font-weight="700">À ÉVITER</text>
  <text x="145" y="625" fill="#ffffff" font-family="Arial, sans-serif" font-size="55" font-weight="700">Un marché énorme qui garde peu.</text>
  <rect x="90" y="745" width="1020" height="300" rx="34" fill="#12382e" stroke="#4ee2a5" stroke-width="6"/>
  <text x="145" y="840" fill="#62efb5" font-family="Arial, sans-serif" font-size="46" font-weight="700">JE CHERCHE</text>
  <text x="145" y="925" fill="#ffffff" font-family="Arial, sans-serif" font-size="55" font-weight="700">De la marge.</text>
  <text x="145" y="995" fill="#ffffff" font-family="Arial, sans-serif" font-size="55" font-weight="700">Un problème coûteux.</text>
  <text x="90" y="1130" fill="#8ed7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">MO ALANI • TAM</text>
